[project]
name = "personal-mcp-for-garmin"
version = "0.4.1"
description = "Unofficial, read-only MCP server for your own Garmin Connect data via Garmin's official Personal API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "GARMIN_TERMS.md"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
]
keywords = ["mcp", "garmin-connect", "health", "fitness", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/jojomango/personal-mcp-for-garmin"
Issues = "https://github.com/jojomango/personal-mcp-for-garmin/issues"
Privacy = "https://github.com/jojomango/personal-mcp-for-garmin/blob/main/PRIVACY.md"

[project.scripts]
personal-mcp-for-garmin = "personal_mcp_for_garmin.server:main"
personal-mcp-for-garmin-setup = "personal_mcp_for_garmin.setup_key:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_mcp_for_garmin"]
