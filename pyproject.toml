[project]
name = "connect-personal-mcp"
version = "0.3.0"
description = "Unofficial, read-only MCP server for your own Garmin Connect data via Garmin's official Personal API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "GARMIN_TERMS.md"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
]
keywords = ["mcp", "garmin-connect", "health", "fitness", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/jojomango/connect-personal-mcp"
Issues = "https://github.com/jojomango/connect-personal-mcp/issues"
Privacy = "https://github.com/jojomango/connect-personal-mcp/blob/main/PRIVACY.md"

[project.scripts]
connect-personal-mcp = "connect_personal_mcp.server:main"
connect-personal-mcp-setup = "connect_personal_mcp.setup_key:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_personal_mcp"]
