# Publishes to PyPI when a version tag (e.g. v0.4.0) is pushed.
# Uses PyPI Trusted Publishing (OIDC): no PyPI token is stored in this repository.
# One-time setup on pypi.org: add a "pending publisher" for project personal-mcp-for-garmin,
# owner jojomango, repository personal-mcp-for-garmin, workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Offline tests
        run: uv run --locked python -m unittest discover -s tests
      - name: Tag matches package version
        run: |
          version=$(uv run --locked python -c "import personal_mcp_for_garmin as p; print(p.__version__)")
          test "v$version" = "$GITHUB_REF_NAME"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
